apiVersion: v1
kind: Pod
metadata:
  name: multi-port-pod
  labels:
    app: multi-port-app
spec:
  containers:
  - name: nginx
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
      name: http
    volumeMounts:
    - name: nginx-config
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: default.conf
      readOnly: true
  - name: metrics
    image: nginx/nginx-prometheus-exporter:1.1.0
    args:
    - -nginx.scrape-uri=http://127.0.0.1/stub_status
    ports:
    - containerPort: 9113
      name: metrics
  volumes:
  - name: nginx-config
    configMap:
      name: multi-port-nginx-config
