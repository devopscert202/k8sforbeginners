apiVersion: v1
kind: Service
metadata:
  name: multi-port-service
  labels:
    app: multi-port-app
spec:
  type: NodePort
  selector:
    app: multi-port-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
    nodePort: 30080
  - name: metrics
    protocol: TCP
    port: 9113
    targetPort: metrics
    nodePort: 30113
