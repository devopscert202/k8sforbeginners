apiVersion: v1
kind: Pod
metadata:
  name: advanced-affinity-pod
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: env
            operator: In
            values:
            - production
            - staging
          - key: disktype
            operator: Exists
          - key: region
            operator: NotIn
            values:
            - us-east
  containers:
  - name: nginx
    image: nginx
