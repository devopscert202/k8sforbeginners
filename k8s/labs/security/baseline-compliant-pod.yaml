apiVersion: v1
kind: Pod
metadata:
  name: baseline-compliant-pod
  namespace: pss-baseline
spec:
  containers:
  - name: nginx-container
    image: nginx:alpine
    ports:
    - containerPort: 80
    securityContext:
      runAsUser: 0  # Running as root is allowed in baseline
      allowPrivilegeEscalation: false
