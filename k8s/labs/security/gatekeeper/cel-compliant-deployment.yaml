apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant-app
  namespace: cel-demo
  labels:
    app: nginx
    env: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
