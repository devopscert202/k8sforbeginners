apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-limits
  namespace: cel-demo
  labels:
    app: test
    env: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
