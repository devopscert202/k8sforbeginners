apiVersion: v1
kind: Pod
metadata:
  name: fixed-init-pod
spec:
  initContainers:
  - name: init-check
    image: busybox
    command:
    - sh
    - -c
    - |
      echo "Performing health check..."
      # Simulate check that might fail
      if [ -f /tmp/should-fail ]; then
        echo "Health check failed"
        exit 1
      fi
      echo "Health check passed"
      exit 0
  containers:
  - name: main-container
    image: busybox
    command: ['sh', '-c', 'echo "Application running"; sleep 3600']
