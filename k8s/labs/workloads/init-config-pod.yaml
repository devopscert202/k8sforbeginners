apiVersion: v1
kind: Pod
metadata:
  name: config-init-pod
spec:
  initContainers:
  - name: install-config
    image: busybox
    command:
    - sh
    - -c
    - |
      echo "Downloading configuration..."
      echo "app.name=MyApplication" > /work-dir/config.properties
      echo "app.version=1.0.0" >> /work-dir/config.properties
      echo "app.environment=production" >> /work-dir/config.properties
      echo "Configuration downloaded successfully"
      ls -l /work-dir/
    volumeMounts:
    - name: workdir
      mountPath: /work-dir
  containers:
  - name: main-app
    image: busybox
    command:
    - sh
    - -c
    - |
      echo "Starting application..."
      echo "Configuration file contents:"
      cat /config/config.properties
      echo "Application running..."
      sleep 3600
    volumeMounts:
    - name: workdir
      mountPath: /config
  volumes:
  - name: workdir
    emptyDir: {}
