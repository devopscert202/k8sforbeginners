apiVersion: v1
kind: Pod
metadata:
  name: multi-pattern-demo
spec:
  # Init Container (runs first)
  initContainers:
  - name: init-setup
    image: busybox
    command: ['sh', '-c', 'echo "Setup complete" > /shared/init.txt']
    volumeMounts:
    - name: shared-data
      mountPath: /shared

  containers:
  # Main application
  - name: main-app
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html
    - name: logs
      mountPath: /var/log/nginx
    lifecycle:
      postStart:
        exec:
          command: ["/bin/sh", "-c", "echo 'App started' >> /var/log/nginx/lifecycle.log"]
      preStop:
        exec:
          command: ["/bin/sh", "-c", "echo 'App stopping' >> /var/log/nginx/lifecycle.log; sleep 5"]

  # Sidecar: Log shipper
  - name: log-shipper
    image: busybox
    command:
    - sh
    - -c
    - |
      while true; do
        if [ -f /logs/access.log ]; then
          echo "Shipping access logs..."
          tail -n 1 /logs/access.log 2>/dev/null || echo "No new logs"
        fi
        sleep 10
      done
    volumeMounts:
    - name: logs
      mountPath: /logs

  # Adapter: Metrics formatter
  - name: metrics-adapter
    image: busybox
    command:
    - sh
    - -c
    - |
      while true; do
        echo "Converting metrics to Prometheus format..."
        echo "nginx_requests_total \$((RANDOM % 1000))"
        sleep 15
      done

  volumes:
  - name: shared-data
    emptyDir: {}
  - name: logs
    emptyDir: {}
