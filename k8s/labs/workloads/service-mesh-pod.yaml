apiVersion: v1
kind: Pod
metadata:
  name: service-mesh-pod
  labels:
    app: myservice
    version: v1
spec:
  containers:
  # Main application
  - name: application
    image: busybox
    command:
    - sh
    - -c
    - |
      mkdir -p /www
      cat > /www/index.html <<HTML
      <html><body>Application v1.0</body></html>
      HTML
      echo "Application starting on port 8080"
      cd /www && httpd -f -p 8080
    ports:
    - containerPort: 8080
      name: http

  # Envoy-like sidecar proxy
  - name: proxy
    image: busybox
    command:
    - sh
    - -c
    - |
      echo "Service mesh proxy started on port 15001"
      echo "Proxying traffic to/from application:8080"
      while true; do
        echo "\$(date): Proxy intercepting traffic"
        echo "  - TLS termination"
        echo "  - Load balancing"
        echo "  - Circuit breaking"
        echo "  - Metrics collection"
        sleep 20
      done
    ports:
    - containerPort: 15001
      name: proxy-port
    - containerPort: 15090
      name: metrics
