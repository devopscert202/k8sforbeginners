apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spa-frontend
  template:
    metadata:
      labels:
        app: spa-frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80

        volumeMounts:
        # Mount runtime config as a JS file
        - name: runtime-config
          mountPath: /usr/share/nginx/html/config.js
          subPath: config.js
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run

      volumes:
      - name: runtime-config
        configMap:
          name: spa-runtime-config
      - name: nginx-config
        configMap:
          name: frontend-config
          items:
          - key: nginx.conf
            path: nginx.conf
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
